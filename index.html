<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#4a7bff;overflow:hidden}
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Escena y fondo azul
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x4a7bff);

// Cámara
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);

// Renderizador (dibuja todo en pantalla)
const R = new THREE.WebGLRenderer({ antialias: true });
R.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(R.domElement);

// Luces
scene.add(new THREE.AmbientLight(0xffffff, 0.75));
const sun = new THREE.DirectionalLight(0xffffff, 0.8);
sun.position.set(3, 5, 4);
scene.add(sun);

// Ajustar tamaño a la pantalla
function resize() {
  const w = innerWidth, h = innerHeight;
  R.setSize(w, h);
  camera.aspect = w / h;
  const d = w / h < 0.8 ? 11 : 8; // más lejos en celular
  camera.position.set(0, 1.6, d);
  camera.lookAt(0, 1.4, 0);
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

// Dibujar un cuadro
R.render(scene, camera);
</script>
</body>
</html>
